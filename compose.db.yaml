# Optional bundled PostgreSQL. Use a URL with host `db` in .env.
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: statuspage
      POSTGRES_USER: status
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U status -d statuspage"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
